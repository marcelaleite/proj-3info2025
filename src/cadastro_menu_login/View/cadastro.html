<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Cadastro - Marcela</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">

  <style>
    body, html {
      margin: 0;
      padding: 0;
      font-family: "Poppins", sans-serif;
      height: 100%;
      overflow: hidden;
    }

    .background-video {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: -1;
      overflow: hidden;
    }

    .background-video video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.6);
      z-index: -1;
    }

    main {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      color: #fff;
      padding: 20px;
    }

    form {
      background: rgba(255, 255, 255, 0.08);
      padding: 25px 30px;
      border-radius: 15px;
      backdrop-filter: blur(10px);
      width: 100%;
      max-width: 450px;
      color: #fff;
    }

    form h2 {
      text-align: center;
      margin-bottom: 10px;
      font-weight: 700;
    }

    form p {
      text-align: center;
      font-size: 14px;
      color: #ccc;
      margin-bottom: 20px;
    }

    label {
      display: block;
      margin-bottom: 5px;
      font-size: 14px;
      font-weight: 600;
    }

    input, textarea {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 10px;
      margin-bottom: 15px;
      font-size: 14px;
    }

    input:focus, textarea:focus {
      outline: 2px solid #1CECE7;
      background: rgba(255, 255, 255, 0.9);
    }

    textarea {
      resize: none;
    }

    .form-actions {
      display: flex;
      justify-content: space-between;
      gap: 10px;
    }

    .btn {
      flex: 1;
      padding: 12px;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      cursor: pointer;
      transition: 0.3s;
      text-align: center;
      text-decoration: none;
    }

    .btn.ghost {
      background: transparent;
      border: 2px solid #1CECE7;
      color: #1CECE7;
    }

    .btn.ghost:hover {
      background: #1CECE7;
      color: #000;
    }

    .btn.primary {
      background: linear-gradient(90deg, #1CECE7, #5DE0FF);
      color: #000;
      font-weight: bold;
    }

    .btn.primary:hover {
      opacity: 0.9;
    }
  </style>
</head>
<body>

  <!-- Fundo em vídeo -->
  <div class="background-video">
    <video autoplay loop muted playsinline>
      <source src="../../../public/img/fundo_da_tela.mp4" type="video/mp4" />
      Seu navegador não suporta reprodução de vídeo.
    </video>
  </div>
  <div class="overlay"></div>

  <!-- Tela de cadastro -->
  <main>
    <form>
      <h2>Crie sua conta</h2>
      <p>Cadastre-se para acessar a plataforma e iniciar projetos.</p>

      <label>Nome completo</label>
      <input type="text" name="nome" placeholder="Seu nome completo" value="{nome}" required />

      <label>E-mail</label>
      <input type="email" name="email" placeholder="exemplo@dominio.com" required />

      <label>Telefone</label>
      <input type="tel" name="telefone" placeholder="(xx) xxxxx-xxxx" required />

      <label>Senha</label>
      <input type="password" name="senha" placeholder="Mínimo 6 caracteres" required />

      <label>Confirmar senha</label>
      <input type="password" name="confirm" placeholder="Repita a senha" required />

      <label>Data de nascimento</label>
      <input type="date" name="dt_nascimento" required />

      <label>Instituição</label>
      <input type="text" name="instituicao" placeholder="Universidade / Empresa (opcional)" />

      <label>Breve descrição / área de pesquisa (opcional)</label>
      <textarea rows="3" name="descricao" placeholder="Ex.: genética molecular, bioinformática..."></textarea>

      <div class="form-actions">
        <a href="homescreen.html" class="btn ghost">Voltar</a>
        <a href="menu.html" class="btn primary">Cadastrar</a>
      </div>
    </form>
  </main>
</body>
</html>
